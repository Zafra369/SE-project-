<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard — PenDown</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="storage.js"></script>
  <script src="layout.js"></script>
  <script src="dashboard.js"></script>
</head>

<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-body">

    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"> <img src="building.png" class="sidebar-icon"> Home </a>
        <a href="journalEntries.html" class="sidebar-link"> <img src="open-book (1).png" class="sidebar-icon"> Journal </a>
        <a href="todoEntries.html" class="sidebar-link"> <img src="list.png" class="sidebar-icon"> To-Do </a>
        <a href="pinned.html" class="sidebar-link"> <img src="pin.png" class="sidebar-icon"> Pinned </a>
        <a href="profile.html" class="sidebar-link"> <img src="user (1).png" class="sidebar-icon"> Profile </a>
      </nav>
    </aside>

    <div class="main-content">

      <header class="topbar">
        <div class="topbar-left">
            <img src="diary.png" class="logo-icon">
            <span> <b> PenDown </b> </span>
          </a>
        </div>
        <a href="profile.html" class="topbar-right">
          <span class="topbar-username" id="topbarUsername"> User </span>
          
        </a>
      </header>

      <main class="page-content">

        <section class="welcome-card">
          <div class="welcome-text">
            <h2 id="welcomeHeading"> Hello, there! </h2>
            <p> Welcome back to PenDown </p>
          </div>
          <div class="datetime-widget">
            <div class="time" id="liveTime"> --:-- </div>
            <div class="date" id="liveDate"> Loading date... </div>
          </div>
        </section>

        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon icon-journal"> <img src="open-book (1).png" class="totalEntriesIcon"> </div>
            <div>
              <div class="stat-number" id="journalCount"> 0 </div>
              <div class="stat-label"> Total Entries </div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon icon-tasks"> <img src="mark.png" class="totalEntriesIcon"> </div>
            <div>
              <div class="stat-number" id="taskCount"> 0 </div>
              <div class="stat-label"> Total Tasks </div>
            </div>
          </div>
        </section>

        <section class="section-block">
          <div class="section-heading">
            <h3> Recent Journal Entries </h3>
            <a href="journalEntries.html" class="see-all"> View all </a>
          </div>
          <div id="recentEntriesList"> </div>
        </section>

        <section class="section-block">
          <div class="section-heading">
            <h3> Recent To-Do Entries </h3>
            <a href="todoEntries.html" class="see-all"> View all </a>
          </div>
          <div id="recentTasksList"></div>
        </section> 

        

      </main>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>

  
</body>
</html>
